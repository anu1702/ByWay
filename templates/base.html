{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Byway{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="stage">
    <div class="phone">
      {% block sos %}
        <div class="emergency-row">
          <a class="sos-strip" href="{% url 'session_mode' 'unsafe' %}?sos=1">
            <span>SOS</span>
            <small>Unsafe Mode</small>
          </a>
          <a class="call-911" href="tel:911">Call 911</a>
        </div>
      {% endblock %}
      {% block content %}{% endblock %}
      {% block tabbar %}{% endblock %}
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
